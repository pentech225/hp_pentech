# 結果
- 14:50 ドア開け・ボール準備
- ランニングでアップしたい。
- 15:00 柔軟（開脚・前屈・股関節・アキレス腱・肩入れ 各8秒）
- ボールを前から上に放り投げて、後ろでキャッチ、同様に後ろから前に
- シュート練習、1つのゴールで近くから、みんなで、私が各々にコメント、少しずつだが上達してます！
- 60秒チャレンジ。3m付近あるいはFTから何本入るか計測。毎回やって記録。その子の成長を可視化して自身に繋げます。今回は2人だけ測定しました。リバウンドは2人必要です。記録とタイマー係も1人で挑めるとなおよいですね。
- レイアップ練習一人3本左右、同様にゴール下からボール拾いとコメント。ボールを持つ１歩目の位置をマーカーで置いておこう。
- 1on1 勝ち残り。順番に戦っていく。私が呼びに行くと、来てくれる楽しくはできている。ただ、並んでくれてはいないし、みんな自由にやっている。うまく仕組み化したい。みんなで観戦できるように。1on1で勝負して、どんな技を使おうかとか、シュートの駆け引きとか、そういうレベルまで来たら1on1は楽しいと思いますが。
- 5on5 x 2(5分、休憩5分) 白熱していました。大人が二人いたので、それぞれのチームに分かれて。よく走れました。 まだバスケやりたいって人と、もう疲れたという人がいて。どうももどかしいです。バレーやドッジボールをしたいって、別の方向に運動をしたい人もいます。反面、バスケをもう一度したいって子もいて、塩梅が難しいです。ただ、始めて間もない人が多いので、あまり無理に参加させてもしんどいと思います。走るのが体力がないのか、バスケの試合にでても、うまく動けないからそこまで楽しくないということなのか。そういうことかもしれない。ただ、体力は、もっとつけてほしいと思います。体力をみんなで付けようという習慣ができたらなおよいです。別の時間に集まって、ランニングをするなどですかね。
- 16:00 終了 片付けをしつつ自主練したい子はしました。集中力はやはり、1時間ぐらいが限界と思います。ずっと体を動かすのではなくて、チームを分けて、4on4を、4チーム作りたいです。そして、マンツーマンディフェンスを教えたいです。数字でコールするために、ビブスを着るようにします。


# 環境・その他
ゲリラ豪雨が途中ですごかったです。雨雲レーダーを毎回確認する必要があると思いました。ビショビショになった（なりに行った？笑）子がいたので、余分にタオルを持っていきます。

最後にモップをかけました。雨がひどい時は、ドアは締めておいた方がいいみたいです。

人が少ないかなと思い、1.5Lx2 ポカリにしたら、足りなかったです。悔しいです。毎回4本は持ってきます。水分不足になると大変なので。

シューズを忘れる子がいるので、絶対に持ってくるように注意を強く言うようにします。

# 次回に向けた課題
- レベルの違うのでうまく練習を分けるかほかのミニバスの練習を参考にする。
- ラストチャンスさん ドッジボール 武庫東小学校 全国にも行ったことのあるチームに、見学に行きます。6/28
- 河川敷のバスケコートで、勧誘してみます。そこまできてバスケをしている人ならば、きっと体育館にも来てくれるかも。
- 塚口ミニバス 週に4回尼崎で活動している。見学に行って勉強させてもらうことを検討しています。たくさん大会にでているし、バスケが好き、体を動かすのが好きな子が、県や全国レベルで活躍する力を養うきっかけになるようなチームを造れたら、本当に価値のある組織になると思うので、頑張ります。
- 尼崎で3on3のオープン戦を調べる。

# 半年間の取り組み
- 目標は部員30名
- 他チームとの交流戦
- 各々個人目標の明確化。
- コーチである私も厚くなってプレーするのも必要。それで盛り上がりますし。同じ目線で楽しむことも大切です。
