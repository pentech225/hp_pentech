# 今日の実績
- 14:50 ドア開け・ボール準備 先生は14:40には来るようにします。学校の事務員さんに声かけるのを忘れずに。
- 15:00 今日は柔軟体操をしなかったです。毎回するようにします。
- 30秒でゴール3mラインからどれだけ入れられるか測定一人ずつ、盛り上がって楽しかったです。ボール籠を近くに置いておいたのが味噌でした。また、リバウンドも練習になります。もう一回やらせてと言ってくれる人もいて。最低2本最高9本でした。自己ベスト更新を目指しましょう。リバウンドの人、ボールをパスする人、タイマー係、シュートする人。計４人で回しました。
- 
- 1on1 練習
  - ポストでパスをもらってから、シュートフェイクをして、ドライブレイアップをすることを教えました。今回教えられたのは二人だけですが、かなりフェイントとしていい感じに仕上がりました。最後のレイアップがまだ慣れずに、そこがもどかしいので、たくさん練習しようと思いました。私がパス出しをしてがいいと思いました。並んでもらって、１人ずつ、まずはディフェンス、つぎ、オフェンスと順番にやりたいです。
- 5on5 x 2(試合6分、休憩10分) 回を重ねるごとに、団子にならずにパスがよく回るようになってきました。体力ある子は、もっと試合したいというが、ない子はもうゲームはいいといいます。体力ある子を基準にして、しんどい子は休んでおいてもらって、回したいです。今は、１０人前後なので、紅白戦ですが、２０人、３０人になると、４－６チーム作って、順番にできるので、自然と休憩もできると思います。私も混ざってやりましたが、右手を封印してプレイすると、自分自身の練習にもなりましたし、いいかんじに競り合えて楽しかったです。ハンデをしっかりつけて、そのうえで全力で勝負する。それができて良かったです。今日は得点版を用意していなかったので、時間も得点もアバウトでしたが、試合を意識してしっかりとタイムリミットぎりぎりまで頑張るということを培っていきたいです。
  - マンツーマンディフェンスしようねって声かけるんじゃなくて、「俺、今、○○みてるから！」など積極的に声出しや指差しなどをして、ディフェンスを行いました。自然と穴がないようにディフェンスできたと思います。まだまだ昼休みバスケの延長戦ではありますが、少しずつでも成長している子ども達の姿を見るのは本当に楽しいです。
- 16:30 モップ ドア閉め 終了 モップがかなり埃っぽいので、ほこりを取るようにしたいです。毎回ですが、片付けを子ども達が手伝ってくれるのが助かります。


# 次回タイムスケジュール
- 開始前準備物
  - 雑巾がけ用の雑巾３枚。
  - モバイルバッテリー充電済みの物 撮影の途中で充電がよくなくなるから。
  - ストップウォッチ
  - ブザー
  - ポカリ2L 2本、麦茶2L 2本。ポカリばっかりだと濃すぎるのと、原価が高いので。
- 開始前14:45-15:00
  - 雑巾がけ10分ほどで。体育館滑るから危ない。最後のモップ掛けは継続してできている。
  - ドア開け、ボール出し、扇風機設置
  - タイマー設置（学校設備）得点ボードがある方が盛り上がるので。
- 15:00-15:20
  - ランニング5分、コーンを置いてぐるぐる回る。
  - 柔軟 どんな柔軟をするかあらかじめ決めておく。声出す人も交代がいいな。
  - ブリッジ耐久　一番堪えれた人を称える。毎回何秒か記録する。慣れてきたら、ブリッジ歩きでハーフコート
  - 逆立ち耐久、ブリッジと同様。先週よりもできるようになったという自信をつけるのと、地味だが、体幹が鍛えられるので是非する。
  - ディフェンスカニ歩きハーフコート（これはまだやったことない。子どもらの集中力を持たせながらやりたい）
  - スキップステップ、片足ずつジャンプしながら前に進んでいく。
- 休憩 5分 ここも必ずタイマーを使う。ダラダラ休憩しない。
  - 練習に参加せずに休んでいる子に、端でスマホ触っているのではなくて、撮影を依頼しようと思います。練習記録残すことで改善点を個人個人で見つけていきたいです。
  - ダッシュハーフコート　測定　二人ずつぐらい。毎回記録を取る。
  - ドリブルダッシュ　測定　同上
  - パス練習　向かい合ってパスをする。基本のボールを回転させて、胸に投げるチェストパスができていない子が多いので、そこをできるようにどう伝えたらいいのか。
  - 四隅に人を分けて、対角線へ楕円に走る。ボールは一つでぐるぐるパスをつないでいく。１０回連続で出来たらクリアなど。ゲーム性を持たせて行う。
  - オールコートで走りながらパスをする。端まで付いたら戻ってくる。これができるようになったら、速攻ができる。
  - 遠投の練習も、速攻には有効かもしれない。うまく織り交ぜる。
- シュート練習
  - 30秒で何本入るか測定する。継続
- 休憩 5分 ここも必ずタイマーを使う。ダラダラ休憩しない。
- レイアップ練習
  - どう教えたらいいか
- 試合
  - 休憩時間は5分、試合も5分。
  - 大人は左手だけで。右手使うと反則
- 片付け モップ 終了

# 課題
- 体育館シューズを忘れた子にどうしてもらうか。取りに帰ってもらうか、コンタクトのないシュートなどだけやってもらうか。
  - リバウンドが危ないのでシューズを履いていないと。
- チェストパスができるようになる練習方法は？
- レイアップができるようになる指導方法が知りたいです。調べます。

# 次回持ち物・注意点
- 雨でぬれたりしたときなど用に予備タオルを３枚ほど携帯、飲み物こぼれたりするし。
- 突き指などに対応できるようにコールドスプレーを。できれば小ぶりのクーラーボックスに氷を作っておく。熱中症などにも対応できるし。
- ビブスを持ってくる。これまではリストバンドで識別していたが、やはり、ビブスの方が試合感がでる。
# 所感
私自身が、中学校で３年間バスケと、社会人でバスケを２，３年趣味でやっていただけの人間なので、基本的なフットワークやどうすれば試合で勝てるかなどが、まだわからないです。手探りですが、あまり気負わずにやっていけたらと思います。一番は、子どもが１人でも来てくれて、思いっきり汗を流して笑顔で帰ってくれたら大成功です。体を動かすって爽快で楽しい。そこにスキルの分析や協力プレイなどどんどん面白い要素を付け加えていけるので、まずは、ボールは友達で、走るのは楽しくて、試合は熱くなれて好きと思ってもらえる環境を作ります。

と同時に、福岡第一の監督の本を買ってみたり、河村選手のYouTubeを見たりと、世界レベルの人たちへの憧れももちろんあります。四の五の言う前に、まずは私自身もしっかり練習してうまくなりたいです。まずはランニングから。ばてない体づくりは、仕事にも生きると思うので。

余談ですが、なぜバスケが好きなのかというと、仕事でしんどかった時に、バスケをすれば体が追い込まれて頭がリセットされて、活力になったということがあります。肩こり、疲労、体重、社会人でいろいろと健康に気を遣う部分があると思いますが、試合５分、休憩５分、繰り返していったら、本当にどうでもよくなります。足が棒になって次の日筋肉痛ですが、関係ありません。そういえば一度、バスケ中に膝を打って、松葉づえで出社したことがありました。柔軟体操は大切です。そして接触スポーツなので、熱くなりすぎないように審判することを心がけます。

心と体の関係性。これは生涯を通した研究テーマだと思っております。しっかりと身体を鍛えぬいて、活力のある状態にしておくと、自ずと周囲への気配りもできるし、有事の際にも即行動ができると思っております。なにより心が病みにくくなります。定期的に日常生活に、少し激しめの無酸素および有酸素運動を取り入れることを私も意識しつつ、広めていけたらいいなと思っております。
