# 今日の実績
2026年7月12日（日）15:00〜16:30
参加 9名（小学生6名 中学生2名 大人1名）
- 14:40 準備開始
- 14:50 ドア開け・窓開け・ボール準備・得点板タイマー出し・ファン設置・シューズ拭き雑巾設置
- 15:00 開始時3名。開始時にそろっている方がビシッと始められますね。。
- 30秒でゴール3mラインからどれだけ入れられるか計測。キッチンタイマーがとても使いやすいです。
- パスラン。フルコート。最後はレイアップ。キャッチをする練習、鋭いパスを出す練習ができている人といない人がいました。もっとパスをキャッチする練習をしようと思いました。
- 1on1
  - 試合の合間にしました。１点取った方が勝ちというルールで行いました。短くぎゅっと集中できるので楽しかったです。
- 5on5 x 3(試合5分、休憩5分) 
  - 中学生のバスケ部２名が参加してくれ、いつもより展開が早くパスもよく回る楽しい試合になりました。
  - ノールックパスは、キャッチ慣れていない子にしたら危なかった。声かけて、アイコンタクトしてからパスするように注意します。
- 16:00 モップ掛け・窓閉め・ファン直す・ドア閉める・消灯
- 今日はブザーを持って行けてよかったです。

# 所感
中学生の人が来てくれて、全力で走ってぶつかれました。楽しかったです。肩こりがなくなりました。デスクワークが多いので血の巡りが悪くなっていたのですが、肩の荷が下りたようなすがすがしい気持ちです。
練習後もシュート練習をしたり1on1をしている人がいて、とてもうれしかったです。
毎日運動をする習慣を改めて作ろうと思いました。

  - 柔軟
  -

  - 逆立ち耐久、ブリッジと同様。先週よりもできるようになったという自信をつけるのと、地味だが、体幹が鍛えられるので是非する。計測する。
