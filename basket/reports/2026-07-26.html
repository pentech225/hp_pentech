# 今回実績
参加　こども約10名　大人約10名　（保護者同伴4組ほど）
大人が多いと、練習の雰囲気も、指導も行き届いたものになってよかったです。経験者の大人の方に来てもらえて、大変助かりました。５人ぐらい指導できる人がいると、３０人、４０人の子どもがいても大丈夫な気がしました。今日は贅沢な練習環境でした。
- 14:30 ドア開け・窓開け・ボール準備・得点板タイマー出し・ファン設置・シューズ拭き雑巾設置
- 14:50 受付
- 15:00-15:20
  - 柔軟、順番に声出ししていったのがよかったです。 
  - ブリッジ歩き。みんなほぼ歩けない。これは、まずは耐久から挑戦します。
- 休憩 3分 タイマー使ってメリハリ出せました。
  
- 対面パス練習　向かい合ってパスをする。上達度合いによって、パス間の距離を近くする。上級者は遠くでする。３０回声出しながらパスをします。お互いに声出すこと。
- ランパス練習　これができるとバスケは本当に楽しくなるので、最後はシュートまでしてもらいました。
- レイアップ練習　
 - 踏切位置にコーンを置いて、まずはボール無しで、ハイタッチの練習。指導者が高いところに手を出してるから。高く飛ぶように指導
 - 次はボール持って、その場で上に投げる練習。みんな上手。
 - ドリブル無し、ただ、ボールをもって走り込みで、レイアップ。
 - 次にボールをもってレイアップ

- シュート練習
 - 近くからシュート、途中でディフェンス有りにした。
- 試合、4人x3チーム ３試合行いました。総当たり
 - 未経験の子も積極的にボールに食らいついていて、とてもうれしかった。シュートチャンスなどもあった。
 - 大人が半分ぐらいだったので、純粋なミニバスではなかった。30人ぐらい人を読んで試合がしたい。トーナメントなど。
 - 最後は親も混ざってもらって、紅白戦をしました。盛り上がってよかったです。
- 表彰 優勝チームにトロフィーと、全員に参加賞で小さなトロフィーを。MVPにはボールをプレゼントしました。得点数えておいて、もっとも得点した人など、MVPは明確な基準を設けようと思いました。
- 片付け モップ 終了

- 各々個人目標の明確化。
- 審判の資格の勉強
