    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(D.salt), iterations:D.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(D.iv)}, key, u8(D.ct));
    document.body.innerHTML = new TextDecoder().decode(buf);
    // innerHTML で入れた <script> は動かないので、作り直して動かす（2026-11-19 見積もりページ用）
    document.body.querySelectorAll("script").forEach(function(old){
      var s = document.createElement("script"); s.textContent = old.textContent; old.replaceWith(s);
    });
    try { sessionStorage.setItem(KEY, pw); } catch(e) {}
  }
  document.getElementById("gate").addEventListener("submit", function(e){
    e.preventDefault();
    open(document.getElementById("pw").value).catch(function(){
      document.getElementById("err").textContent = "パスワードが違います";
    });
  });
  try { var s = sessionStorage.getItem(KEY); if (s) open(s).catch(function(){}); } catch(e) {}
})();
</script>
