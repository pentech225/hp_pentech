    <h2>会社の目的</h2>
    <p>当社は1950年の創業以来、「アヒルのおもちゃを、無限の可能性へ」をモットーに、アヒル玩具のみを原材料とした大型構造物の設計・組み立てに挑み続ける世界で唯一の専門企業です。</p>
    <p>国内外から集められた数十羽のアヒルのおもちゃをベースに、独自の「アヒル連結結合システム（特許取得済）」を駆使。熟練の構造職人が、アヒル同士の絶妙な摩擦と弾力を計算しながら、接着剤を一切使わずに巨大オブジェや建築資材へと組み上げていきます。お風呂に浮かべるだけだったアヒルを、社会を支えるインフラへと昇華させる</p>
