            padding: 20px 0;

        .thumb {

            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #f2f2f2;

            height: 100%;

            display: block;

    <script src="../js/katudou-data.js"></script>
    <script>
    (function () {
        var BASE = '../';                       // データのパスは school/mukonoso/ から
        var FALLBACK = BASE + 'images/school_image.png';

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function youtubeId(url) {
            if (!url) return '';
            var m = url.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }
        function href(path) {
            if (!path) return '';
            return /^https?:\/\//.test(path) ? path : BASE + path;
        }
        // 4月始まりの年度
        function fiscalYear(d) {
            return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
        }

        var items = (typeof KATUDOU !== 'undefined' ? KATUDOU : []).slice();
        items.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

        var groups = {}, order = [];
        items.forEach(function (it) {
            var p = it.date.split('-');
            var d = new Date(+p[0], +p[1] - 1, +(p[2] || 1));
            it._noDay = !p[2];
            it._d = d;
            var fy = fiscalYear(d);
            if (!groups[fy]) { groups[fy] = []; order.push(fy); }
            groups[fy].push(it);
        });

        var html = '';
        order.forEach(function (fy) {
            html += '<section class="year"><h2>' + fy + '年度</h2>';
            groups[fy].forEach(function (it) {
                var yid = youtubeId(it.youtube);
                var thumb = it.thumb ? href(it.thumb)
                          : yid ? 'https://i.ytimg.com/vi/' + yid + '/hqdefault.jpg'
                          : FALLBACK;
                var main = it.youtube || href(it.link);
                var ext = /^https?:\/\//.test(main);
                var target = ext ? ' target="_blank" rel="noopener noreferrer"' : '';
                var date = (it._d.getMonth() + 1) + "月" + (it._noDay ? "" : it._d.getDate() + "日");
                var st = it.status || '';
                var stCls = (st === '中止' || st === 'お休み') ? 'status off' : 'status';

                var img = '<img src="' + esc(thumb) + '" alt="' + esc(it.title) + '" loading="lazy" onerror="this.onerror=null;this.src=\'' + FALLBACK + '\'">';
                var thumbHtml = main
                    ? '<a class="thumb" href="' + esc(main) + '"' + target + '>' + img + (yid ? '<span class="play">▶ 動画</span>' : '') + '</a>'
                    : '<div class="thumb">' + img + '</div>';
                var titleHtml = main
                    ? '<a href="' + esc(main) + '"' + target + '>' + esc(it.title) + '</a>'
                    : esc(it.title);

                var links = [];
                if (it.link) links.push('<a href="' + esc(href(it.link)) + '">詳しく見る</a>');
                if (it.youtube) links.push('<a href="' + esc(it.youtube) + '" target="_blank" rel="noopener noreferrer">YouTubeで見る</a>');

                html += '<article class="item' + (st === '予定' ? ' is-plan' : '') + '">'
                     +   thumbHtml
                     +   '<div>'
                     +     '<div class="meta">' + date + (st ? '<span class="' + stCls + '">' + esc(st) + '</span>' : '') + '</div>'
                     +     '<h3>' + titleHtml + '</h3>'
                     +     (it.note ? '<p>' + esc(it.note) + '</p>' : '')
                     +     (links.length ? '<div class="links">' + links.join('') + '</div>' : '')
                     +   '</div>'
                     + '</article>';
            });
            html += '</section>';
        });
        document.getElementById('katudou-list').innerHTML = html || '<p>まだ記録がありません。</p>';
    })();
    </script>
