            <!-- 
                ============================================
                ブログ記事を追加する方法
                ============================================
                
                【新しい記事を追加する手順】
                
                1. 記事ファイルを作成
                   - ARTICLE_TEMPLATE.html をコピー
                   - ファイル名を変更（例: article-20260215.html）
                   - 記事の内容を編集
                
                2. このブログ一覧に記事を追加
                   - 下の <div class="blog-list"> の中に新しい記事のHTMLを追加
                   - 記事は上から新しい順に並べる（最新が一番上）
                   - 記事のリンク（href）を、作成したファイル名に変更
                
                3. 記事のHTML構造（コピーして使用）:

                【記事HTML例】
                <article class="blog-item">
                    <div class="blog-item-header">
                        <span class="blog-date">2026.02.15</span>
                        <span class="blog-category">イベント</span>
                    </div>
                    <h2 class="blog-item-title">記事タイトルをここに入力</h2>
                    <div class="blog-item-content">
                        記事の要約や冒頭部分をここに入力します。読者の興味を引く内容にしましょう。
                    </div>
                    <a href="article-20260215.html" class="blog-item-link">続きを読む</a>
                </article>
                
                【カテゴリの選択肢】
                - イベント
                - 授業レポート
                - プログラミングのコツ
                - 教室の様子
                - 教室長からのメッセージ
                - お知らせ
                
                【特別な強調が必要な記事の場合】
                背景色を変更できます:
                <article class="blog-item" style="background: linear-gradient(135deg, #fff8e1 0%, var(--white) 100%);">
                
                ============================================
            -->
            
            <div class="blog-list" id="blog-list">
                <!-- 記事はJavaScriptで動的に読み込まれます（API + 静的記事を統合） -->
                <div id="blog-loading" style="text-align: center; padding: 40px; color: #666;">
                    記事を読み込み中...
                </div>
            </div>

    <script>
        // ブログ記事を読み込んで表示（データは js/blog-data.js を共通利用）
        async function loadBlogArticles() {
            const blogList = document.getElementById('blog-list');
            const loadingEl = document.getElementById('blog-loading');

            const allArticles = await window.BlogData.getArticles();

            loadingEl.remove();
            blogList.innerHTML = allArticles.map(article => {
                const itemStyle = article.itemStyle || '';
                const titleStyle = article.titleStyle || '';
                const categoryStyle = article.categoryStyle || '';
                const contentStyle = article.contentStyle || '';
                return `
                <article class="blog-item"${itemStyle ? ' style="' + itemStyle + '"' : ''}>
                    ${article.thumbnail ? `<img src="${article.thumbnail}" alt="${article.title}" class="blog-item-thumbnail">` : ''}
                    <div class="blog-item-header">
                        <span class="blog-date">${article.date}</span>
                        <span class="blog-category"${categoryStyle ? ' style="' + categoryStyle + '"' : ''}>${article.category}</span>
                    </div>
                    <h2 class="blog-item-title"${titleStyle ? ' style="' + titleStyle + '"' : ''}>${article.title}</h2>
                    <div class="blog-item-content"${contentStyle ? ' style="' + contentStyle + '"' : ''}>${article.content}</div>
                    <a href="${article.href}" class="blog-item-link">続きを読む</a>
                </article>`;
            }).join('');
        }

        loadBlogArticles();
    </script>
