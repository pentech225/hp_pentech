<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📘 ITパスポート試験対策コース | PenTech</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- 個人アカウント -->
  <script src="../config.js"></script>
  <script src="../portal-common.js"></script>
  <script src="../auth-check.js"></script>

  <!-- 動画データ -->
  <script src="videos.js"></script>
  <script src="quizzes.js"></script>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --primary: #4A90E2;
      --primary-dark: #357ABD;
      --accent: #F5A623;
      --text: #333333;
      --bg: #FAFAFA;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .hero {
      background: linear-gradient(150deg, #e0f2ff 0%, var(--white) 100%);
      text-align: center;
      padding: 36px 20px 28px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      color: var(--primary);
    }

    .hero p {
      margin: 0;
      color: #666;
      font-size: 0.95rem;
    }

    .hero .back-link {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
    }

    .hero .back-link:hover { text-decoration: underline; }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .homework-banner {
      background: linear-gradient(135deg, #fff8ec, var(--white));
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 16px 20px;
      margin-top: 24px;
    }

    .homework-banner .hw-title {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .homework-banner .hw-item {
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 24px;
    }

    @media (min-width: 640px) {
      .video-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .video-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }

    .video-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .yt-player {
      width: 100%;
      height: 100%;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(74, 144, 226, 0.92);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 22px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .play-btn:hover { background: var(--primary-dark); }

    .player-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 0.9rem;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 20px;
      pointer-events: none;
    }

    .player-error {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: white;
      text-align: center;
      padding: 16px;
    }

    .player-error p {
      margin: 0;
      font-size: 0.85rem;
    }

    .player-error a {
      color: #fff;
      background: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .player-error a:hover { background: var(--primary-dark); }

    .hw-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent);
      color: white;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .quiz-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #eefaf0, var(--white));
      border: 2px solid #4caf50;
      border-radius: 14px;
      padding: 18px 20px;
    }

    .quiz-label {
      display: inline-block;
      background: #4caf50;
      color: white;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .quiz-question {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .quiz-choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .quiz-choices { grid-template-columns: repeat(2, 1fr); }
    }

    .quiz-choice-btn {
      text-align: left;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .quiz-choice-btn:hover:not(:disabled) {
      border-color: #4caf50;
      background: #f3fff4;
    }

    .quiz-choice-btn:disabled { cursor: default; }

    .quiz-choice-btn.correct {
      border-color: #2e7d32;
      background: #c8e6c9;
      font-weight: bold;
    }

    .quiz-choice-btn.incorrect {
      border-color: #F44336;
      background: #ffcdd2;
    }

    .quiz-result {
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .quiz-result.correct { color: #2e7d32; }
    .quiz-result.incorrect { color: #F44336; }

    .video-info { padding: 12px 14px 14px; }

    .video-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .video-progress {
      font-size: 0.82rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-bar-track {
      flex: 1;
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
    }

    footer {
      text-align: center;
      padding: 24px 20px;
      color: #999;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>📘 ITパスポート試験対策コース</h1>
    <p>動画を見て学ぼう！</p>
    <a class="back-link" href="../index.html">← ポータルにもどる</a>
  </div>

  <div class="container">
    <div id="homework-container"></div>
    <div class="video-grid" id="video-grid"></div>
  </div>

  <footer>&copy; 2026 PenTech　<a href="admin/login.html" style="color:#999;">先生用</a></footer>

  <script src="itpassport.js"></script>
</body>
</html>
